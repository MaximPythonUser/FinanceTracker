<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Операции — Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/expenses.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <a href="/" class="back-btn" aria-label="На главную">←</a>
      <h1 class="topbar-title">Операции</h1>
      <button class="topbar-icon" id="statsToggle" aria-label="Статистика" title="Статистика">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      </button>
    </header>

    <!-- ===== Search ===== -->
    <div class="search-bar">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск по описанию или кошельку" autocomplete="off" />
    </div>

    <!-- ===== Filters (horizontal scroll) ===== -->
    <div class="filters-scroll">
      <div class="filters" id="filters">
        <button class="filter-pill active" data-period="week">Неделя</button>
        <button class="filter-pill" data-period="month">Месяц</button>
        <button class="filter-pill" data-period="year">Год</button>
        <button class="filter-pill" data-wallet="all">Все кошельки</button>
        <button class="filter-pill" data-transfers="true">Без переводов</button>
      </div>
    </div>

    <!-- ===== Двухколоночная сетка ===== -->
    <div class="app-layout">

      <!-- Левая колонка: статистика + категории -->
      <div class="column-left">
        <!-- Stats block -->
        <section class="stats-block" id="statsBlock">
          <div class="stats-total">
            <span class="stats-label">Траты за период</span>
            <strong class="stats-amount" id="totalSpent">0 ₽</strong>
          </div>
          <div class="chart-container">
            <canvas id="doughnutChart"></canvas>
            <div class="chart-center-label" id="chartCenterLabel">0 ₽</div>
          </div>
        </section>

        <!-- Categories -->
        <section class="categories-section" id="categoriesSection">
          <h3 class="section-title">Категории расходов</h3>
          <div class="categories-list" id="categoriesList"></div>
        </section>

        <!-- Info banner -->
        <div class="info-banner" id="infoBanner">
          <div class="info-banner-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </div>
          <div class="info-banner-content">
            <strong class="info-banner-title">Пусто</strong>
            <p class="info-banner-text">Добавьте первый доход или расход, чтобы увидеть аналитику здесь.</p>
          </div>
        </div>
      </div>

      <!-- Правая колонка: поиск + фильтры + список операций -->
      <div class="column-right">
        <section class="transactions-section" id="transactionsSection">
          <h3 class="section-title">Все операции</h3>
          <div class="transactions-list" id="transactionsList"></div>
          <div class="empty-state" id="emptyState">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/></svg>
            <p>Операций пока нет</p>
          </div>
        </section>
      </div>

    </div>

  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="/static/expenses.js"></script>
</body>
</html>
